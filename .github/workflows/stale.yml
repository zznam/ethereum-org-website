name: Close Stale Issues

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  stale:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/stale@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-label: "Status: Stale"
          stale-issue-message: "This issue is stale because it has been open 45 days with no activity."
          days-before-stale: 45
          days-before-close: -1
